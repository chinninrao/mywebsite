<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Page</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      text-align: center;
      margin-top: 100px;
    }

    h1 {
      color: #333;
    }

    .btn {
      padding: 15px 30px;
      font-size: 18px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #45a049;
    }
  </style>
</head>

<body>

  <h1>Welcome to Class Time Table</h1>

  <button class="btn" onclick="openPage()">
    Open Time Table
  </button>

  <script>
    function openPage() {
      window.location.href = "timetable.html";
    }
  </script>

</body>
</html>
