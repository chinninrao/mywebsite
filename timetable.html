<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Time Table</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: white;
    }

    th, td {
      border: 1px solid #999;
      padding: 12px;
      text-align: center;
    }

    th {
      background-color: #4CAF50;
      color: white;
    }

    .break {
      background-color: #ffe680;
      font-weight: bold;
    }

    .back-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>School Time Table</h1>

  <table>
    <tr>
      <th>Day</th>
      <th>9-10</th>
      <th>10-11</th>
      <th>11-11:30</th>
      <th>11:30-12:30</th>
      <th>12:30-1:30</th>
    </tr>

    <tr>
      <td>Monday</td>
      <td>Maths</td>
      <td>Science</td>
      <td class="break">Break</td>
      <td>English</td>
      <td>Computer</td>
    </tr>

    <tr>
      <td>Tuesday</td>
      <td>English</td>
      <td>Maths</td>
      <td class="break">Break</td>
      <td>Social</td>
      <td>GK</td>
    </tr>

    <tr>
      <td>Wednesday</td>
      <td>Science</td>
      <td>Computer</td>
      <td class="break">Break</td>
      <td>Maths</td>
      <td>Sports</td>
    </tr>
  </table>

  <center>
    <button class="back-btn" onclick="goBack()">
      Back
    </button>
  </center>

  <script>
    function goBack() {
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
